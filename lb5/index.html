<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа № 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Лабораторная работа № 5</h1>
    <h2>Позиционирование элементов</h2>

    <main class="examples">
        <section class="example">
            <h3>Static и Relative</h3>
            <div class="flow">
                <div class="box box-static">Static</div>
                <div class="box box-static">Static</div>
                <div class="box box-relative-1">Relative 1</div>
                <div class="box box-relative-2">Relative 2</div>
            </div>
        </section>

        <section class="example">
            <h3>Absolute</h3>
            <div class="container">
                <div class="box box-absolute-1">Absolute 1</div>
                <div class="box box-absolute-2">Absolute 2</div>
                <div class="box box-absolute-3">Absolute 3</div>
            </div>
        </section>

        <section class="example">
            <h3>Z-index</h3>
            <div class="overlap">
                <div class="box box-zindex-1">Z-index 5</div>
                <div class="box box-zindex-2">Z-index 4</div>
            </div>
        </section>
    </main>

    <div class="box box-fixed-1">Fixed Top-Right</div>
    <div class="box box-fixed-2">Fixed Bottom-Left</div>
</body>
</html>
